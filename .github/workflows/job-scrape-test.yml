name: job-scrape-test
on:
  workflow_dispatch:
    inputs:
      wave_start: { description: "start index", default: "0" }
      wave_end:   { description: "end index",   default: "30" }
  push:
    branches: [job-scrape-test]
    paths: ["gha_scrape.py", ".github/workflows/job-scrape-test.yml"]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run scraper
        env:
          WAVE_START: ${{ github.event.inputs.wave_start || '0' }}
          WAVE_END:   ${{ github.event.inputs.wave_end   || '1000' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python gha_scrape.py
      - name: Commit results back
        run: |
          git config user.name  "gha-bot"
          git config user.email "gha@users.noreply.github.com"
          git add scrape_results.json || true
          git commit -m "chore: scrape results [skip ci]" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
